<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Employee Management System</title>

    <style>

        /* ================= RESET ================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* ================= BODY ================= */

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            transition: background-color 0.3s,
                        color 0.3s;
        }


        /* ================= LIGHT THEME ================= */

        body.light {
            background-color: #f5f5f5;
            color: #222;
        }

        body.light .login-container {
            background-color: white;
            color: #222;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        body.light input {
            background-color: white;
            color: #222;
            border: 1px solid #ccc;
        }


        /* ================= DARK THEME ================= */

        body.dark {
            background-color: #121212;
            color: white;
        }

        body.dark .login-container {
            background-color: #1e1e1e;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.08);
        }

        body.dark h2 {
            color: white;
        }

        body.dark label {
            color: #ddd;
        }

        body.dark input {
            background-color: #2b2b2b;
            color: white;
            border: 1px solid #555;
        }

        body.dark input::placeholder {
            color: #aaa;
        }


        /* ================= LOGIN CONTAINER ================= */

        .login-container {

            width: 400px;
            max-width: 90%;

            padding: 35px;

            border-radius: 10px;

            transition:
                background-color 0.3s,
                color 0.3s;

        }


        /* ================= TITLE ================= */

        h2 {

            text-align: center;

            margin-bottom: 30px;

            font-size: 28px;

        }


        /* ================= LABEL ================= */

        label {

            display: block;

            margin-bottom: 8px;

            font-size: 15px;

            font-weight: bold;

        }


        /* ================= INPUT ================= */

        input[type="text"],
        input[type="password"] {

            width: 100%;

            padding: 12px;

            border-radius: 5px;

            font-size: 15px;

            outline: none;

            transition:
                background-color 0.3s,
                color 0.3s,
                border-color 0.3s;

        }


        input[type="text"]:focus,
        input[type="password"]:focus {

            border-color: #00bcd4;

        }


        /* ================= FORM GROUP ================= */

        .form-group {

            margin-bottom: 20px;

        }


        /* ================= LOGIN BUTTON ================= */

        input[type="submit"] {

            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 5px;

            background-color: #00bcd4;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

        }


        input[type="submit"]:hover {

            background-color: #0097a7;

        }


        /* ================= REGISTER LINK ================= */

        .register-link {

            text-align: center;

            margin-top: 20px;

            font-size: 14px;

        }


        .register-link a {

            color: #00bcd4;

            text-decoration: none;

            font-weight: bold;

        }


        .register-link a:hover {

            text-decoration: underline;

        }


        /* ================= THEME BUTTONS ================= */

        .theme-buttons {

            display: flex;

            justify-content: center;

            gap: 10px;

            margin-bottom: 25px;

        }


        .theme-buttons a {

            color: #00bcd4;

            text-decoration: none;

            border: 1px solid #00bcd4;

            padding: 7px 12px;

            border-radius: 5px;

            font-size: 13px;

            transition: 0.3s;

        }


        .theme-buttons a:hover {

            background-color: #00bcd4;

            color: white;

        }


        /* ================= HOME LINK ================= */

        .home-link {

            display: block;

            text-align: center;

            margin-top: 15px;

            color: #00bcd4;

            text-decoration: none;

            font-size: 14px;

        }


        .home-link:hover {

            text-decoration: underline;

        }


        /* ================= MOBILE ================= */

        @media (max-width: 500px) {

            .login-container {

                width: 95%;

                padding: 25px;

            }

            h2 {

                font-size: 24px;

            }

        }

    </style>

</head>


<body class="{{ theme }}">


    <div class="login-container">


        <!-- ================= THEME BUTTONS ================= -->

        <div class="theme-buttons">

            <a href="/set-theme/light">
                ☀ Light
            </a>

            <a href="/set-theme/dark">
                🌙 Dark
            </a>

        </div>


        <!-- ================= TITLE ================= -->

        <h2>
            Login Form
        </h2>


        <!-- ================= LOGIN FORM ================= -->

        <form action="/login"
              method="post">


            <div class="form-group">

                <label for="username">
                    Username:
                </label>

                <input type="text"
                       id="username"
                       name="username"
                       placeholder="Enter username"
                       required>

            </div>


            <div class="form-group">

                <label for="password">
                    Password:
                </label>

                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Enter password"
                       required>

            </div>


            <input type="submit"
                   value="Login">


        </form>


        <!-- ================= REGISTER ================= -->

        <div class="register-link">

            Don't have an account?

            <a href="/register">
                Register
            </a>

        </div>


        <!-- ================= HOME ================= -->

        <a href="/"
           class="home-link">

            ← Back to Home

        </a>


    </div>


</body>

</html>
